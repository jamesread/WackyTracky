# Marketing screenshots, captured by `make` in this directory against the
# throwaway server it starts (see Makefile and seed/).
#
# title/description/theme are not used by repo-helper; `make manifest` turns
# them into screenshot-manifest.yaml for indexers. Every section needs them.

[DEFAULT]
base_url = http://127.0.0.1:18480/
dir = .
width = 1280
height = 800
script = scripts/login.py, scripts/light.py, scripts/prepare.py
post_script_sleep = 1.5
theme = light
manifest_project = WackyTracky
manifest_base_url = https://raw.githubusercontent.com/jamesread/WackyTracky/main/var/marketing/screenshots/

[home]
url = .
title = All your lists at a glance
description = The home page shows every list with a count of its open tasks, so you can see where the work is and jump straight in.

[list]
url = lists/a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d
title = A focused task list
description = Each list is a plain todo.txt list with priorities, tags and contexts shown as coloured chips. Type in the bar at the top to add a task without leaving the keyboard.

[task-details]
url = lists/a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d
script = scripts/login.py, scripts/light.py, scripts/prepare.py, scripts/task-details.py
title = Task details and notes
description = Open any task to change its due date and priority, keep notes, or move it to another list.

[search]
url = search?q=@work
title = Search across every list
description = Search all lists at once by text, #tag or @context, and save searches you use often.

[tag-properties]
url = control-panel/task-property-properties
title = Colours and rules for tags and contexts
description = Give tags and contexts their own colours, and hide tasks at certain times, such as work tasks at the weekend.

# No dark variant yet: the list view does not fully support dark mode (light page
# background, unreadable card titles). Add [list-dark] with scripts/dark.py, last,
# once it does; the browser session (and localStorage) is shared between sections.
