syntax = "proto3";

package wackytracky.clientapi.v1;

option go_package = "github.com/wacky-tracky/wacky-tracky-server/gen/wacky-tracky/clientapi/v1;clientv1";

message List {
	string id = 1;
	string title = 2;
	int32 count_items = 3;
}

message GetListsRequest {}
message GetListsResponse {
	repeated List lists = 1;
}

message CreateListRequest {
	string title = 1;
}

message CreateListResponse{}

message CreateTaskRequest {
	string content = 1;
	string parent_list_id = 2;  // optional; when set, task is added to this list
	string parent_task_id = 3;  // optional; when set, task is created as subtask of this task
}

message CreateTaskResponse {
	Task task = 1;
}

message UpdateTaskRequest {
	string id = 1;
	string content = 2;
}

message UpdateTaskResponse {
	Task task = 1;
}

message DoneTaskRequest {
	string id = 1;  // task id to mark done
}

message DoneTaskResponse {}

message MoveTaskRequest {
	string task_id = 1;
	string target_list_id = 2;
}

message MoveTaskResponse {}

// Task metadata (e.g. notes) — optional per driver
message GetTaskMetadataRequest {
	string task_id = 1;
}
message GetTaskMetadataResponse {
	map<string, string> fields = 1;
}
message SetTaskMetadataRequest {
	string task_id = 1;
	string field = 2;
	string value = 3;
}
message SetTaskMetadataResponse {}

// TaskPropertyProperties: optional key/value settings per task property (e.g. tag #work, context @home).
// Supported keys: css (arbitrary CSS for the tag/context chip style attribute), hide-at-times.
message TaskPropertyProps {
	map<string, string> props = 1;
}

message GetTaskPropertyPropertiesRequest {}
message GetTaskPropertyPropertiesResponse {
	map<string, TaskPropertyProps> tag_properties = 1;     // tag name -> props (e.g. css)
	map<string, TaskPropertyProps> context_properties = 2; // context name -> props
}

message SetTaskPropertyPropertyRequest {
	string property_type = 1;  // "tag" or "context"
	string property_name = 2;
	string key = 3;
	string value = 4;
}
message SetTaskPropertyPropertyResponse {}

// RuleStatus returns current date/time components for hide-at-times rule builder (D=day short name, H=hour, M=minute).
message RuleStatusRequest {}
message RuleStatusResponse {
	string D = 1;  // short day name: Mon, Tue, ..., Sun
	int32 H = 2;  // hour 0-23
	int32 M = 3;  // minute 0-59
}

// RuleTest compiles and evaluates a hide-at-times expression; used by UI to validate and preview rules.
message RuleTestRequest {
	string expression = 1;
}
message RuleTestResponse {
	bool compiles = 1;
	string compile_error = 2;  // set when compiles is false
	bool result = 3;           // set when compiles is true (eval result)
	string eval_error = 4;     // set when compiles is true but eval failed
}


message Tag {
	string id = 1;
	string title = 2;
}

message TagRequest {}
message TagResponse {}

message GetTagsRequest{}
message GetTagsResponse{
	repeated Tag tags = 1;
}

message Task {
	string id = 1;
	string content = 2;
	string parent_id = 3;
	string parent_type = 4;
	int32 count_subitems = 5;
	repeated string tags = 6;  // parsed from #hashtag in todo.txt lines
	repeated string contexts = 7;  // parsed from @context in todo.txt lines (e.g. @home @work)
	string wait_until = 8;  // optional; ISO date-time; task is hidden from list/next-action until this time
	string priority = 9;  // optional; single letter A–Z; stored as priority:X in todo.txt
	string due_date = 10;  // optional; ISO date YYYY-MM-DD; stored in metadata like wait
}

message ListTasksRequest {
	string parent_id = 1;
	string parent_type = 2;
}

// TaskIdList holds ordered child task IDs for a parent in the tree.
message TaskIdList {
	repeated string ids = 1;
}

message ListTasksResponse {
	repeated Task tasks = 1;
	// tree: parent ID (list ID for roots) -> ordered child task IDs. Enables client to render hierarchy without extra calls.
	map<string, TaskIdList> tree = 2;
	// Tags/contexts whose hide-at-times rule is currently true; tasks with these are excluded from tasks/tree.
	repeated string hidden_tag_names = 3;
	repeated string hidden_context_names = 4;
}

message SearchTasksRequest {
	string query = 1;  // freetext search; backends may optionally support it
}

message SearchTasksResponse {
	repeated Task tasks = 1;
}

message UpdateListRequest {
	string id = 1;
	string title = 2;
}
message UpdateListResponse {}

message DeleteListRequest {
	string id = 1;
}
message DeleteListResponse {}

message InitRequest {}
message InitResponse {
	string wallpaper = 1;
	bool show_footer = 2;
	bool show_new_versions = 3;
	string available_version = 4;
	string current_version = 5;
	string page_title = 6;
	bool show_version_number = 7;
}

message VersionRequest {}
message VersionResponse {
	string version = 1;
	string commit = 2;
	string date = 3;
}

message RepoStatusRequest {}
message RepoStatusResponse {
	string output = 1;  // git status output for the todotxt directory, or error message
}

message RepoSyncRequest {
	string server_name = 1;
}
message RepoSyncResponse {
	bool success = 1;
	string message = 2;
	repeated string steps = 3;
}

message SavedSearch {
	string id = 1;
	string name = 2;
	string query = 3;
}

message GetSavedSearchesRequest {}
message GetSavedSearchesResponse {
	repeated SavedSearch saved_searches = 1;
}

message SetSavedSearchesRequest {
	repeated SavedSearch saved_searches = 1;
}
message SetSavedSearchesResponse {}

// --- IAM / authentication ---

message StandardResponse {
	bool success = 1;
	string message = 2;
}

message GetStatusRequest {}

message GetStatusResponse {
	string username = 1;
	bool is_logged_in = 2;
	repeated string rbac_permissions = 3;
	bool rbac_is_superuser = 4;
	bool is_impersonating = 5;
	string impersonator_username = 6;
	bool uses_secure_cookies = 7;
	string account_created_at = 8;
	// Task backend driver from config (database.driver). Only set when the
	// caller may view system status (superuser, system.logs, or control-panel privileges).
	string database_driver = 9;
}

message LoginWithUsernameAndPasswordRequest {
	string username = 1;
	string password = 2;
}

message LoginWithUsernameAndPasswordResponse {
	StandardResponse standard_response = 1;
	string username = 2;
}

message LogoutRequest {}

message LogoutResponse {
	StandardResponse standard_response = 1;
}

message ChangePasswordRequest {
	string current_password = 1;
	string new_password = 2;
}

message ChangePasswordResponse {
	StandardResponse standard_response = 1;
}

message UserAccount {
	int32 id = 1;
	string username = 2;
	string created_at = 3;
	string created_by = 4;
	repeated UserGroup user_groups = 5;
}

message GetUsersRequest {}

message GetUsersResponse {
	repeated UserAccount users = 1;
}

message GetUserRequest {
	int32 user_id = 1;
}

message GetUserResponse {
	UserAccount user = 1;
	repeated UserGroup user_groups = 2;
}

message CreateUserRequest {
	string username = 1;
	string password = 2;
}

message CreateUserResponse {
	StandardResponse standard_response = 1;
	UserAccount user = 2;
}

message DeleteUserRequest {
	int32 user_id = 1;
}

message DeleteUserResponse {
	StandardResponse standard_response = 1;
}

message ResetUserPasswordRequest {
	int32 user_id = 1;
	string new_password = 2;
}

message ResetUserPasswordResponse {
	StandardResponse standard_response = 1;
}

message RbacPermission {
	int32 id = 1;
	string name = 2;
	string description = 3;
}

message RbacRole {
	int32 id = 1;
	string name = 2;
	string description = 3;
	repeated int32 permission_ids = 4;
	int32 group_count = 5;
	int32 user_count = 6;
}

message ListRbacPermissionsRequest {}

message ListRbacPermissionsResponse {
	repeated RbacPermission permissions = 1;
}

message ListRbacRolesRequest {}

message ListRbacRolesResponse {
	repeated RbacRole roles = 1;
}

message CreateRbacRoleRequest {
	string name = 1;
	string description = 2;
	repeated int32 permission_ids = 3;
}

message CreateRbacRoleResponse {
	RbacRole role = 1;
}

message UpdateRbacRoleRequest {
	int32 id = 1;
	string name = 2;
	string description = 3;
	repeated int32 permission_ids = 4;
}

message DeleteRbacRoleRequest {
	int32 id = 1;
}

message DeleteRbacRoleResponse {}

message GetUserRbacRolesRequest {
	int32 user_id = 1;
}

message GetUserRbacRolesResponse {
	repeated RbacRole roles = 1;
}

message GetUserGroupRbacRolesRequest {
	int32 group_id = 1;
}

message GetUserGroupRbacRolesResponse {
	repeated int32 role_ids = 1;
}

message SetUserGroupRbacRolesRequest {
	int32 group_id = 1;
	repeated int32 role_ids = 2;
}

message SetUserGroupRbacRolesResponse {
	StandardResponse standard_response = 1;
}

message GetRbacRoleUsersRequest {
	int32 role_id = 1;
}

message GetRbacRoleUsersResponse {
	repeated string usernames = 1;
}

message GetRbacRoleGroupsRequest {
	int32 role_id = 1;
}

message GetRbacRoleGroupsResponse {
	repeated string group_names = 1;
}

message MyPermissionAuditRow {
	string permission = 1;
	bool granted = 2;
	repeated string granting_groups = 3;
}

message GetMyPermissionsAuditRequest {}

message GetMyPermissionsAuditResponse {
	repeated string group_names = 1;
	repeated string role_names = 2;
	bool is_superuser = 3;
	repeated MyPermissionAuditRow permissions = 4;
}

message UserGroup {
	int32 id = 1;
	string name = 2;
	int32 member_count = 3;
}

message ListUserGroupsRequest {}

message ListUserGroupsResponse {
	repeated UserGroup groups = 1;
}

message CreateUserGroupRequest {
	string name = 1;
}

message CreateUserGroupResponse {
	UserGroup group = 1;
}

message DeleteUserGroupRequest {
	int32 group_id = 1;
}

message DeleteUserGroupResponse {}

message GetUserGroupMembersRequest {
	int32 group_id = 1;
}

message GetUserGroupMembersResponse {
	repeated UserAccount members = 1;
}

message SetUserGroupMembersRequest {
	int32 group_id = 1;
	repeated int32 user_ids = 2;
}

message SetUserGroupMembersResponse {
	StandardResponse standard_response = 1;
}

message ImpersonateUserRequest {
	int32 user_id = 1;
}

message ImpersonateUserResponse {
	StandardResponse standard_response = 1;
}

message StopImpersonationRequest {}

message StopImpersonationResponse {
	StandardResponse standard_response = 1;
}

message ApiKey {
	int32 id = 1;
	string name = 2;
	string created_at = 3;
	string last_used_at = 4;
	bool read_only = 5;
}

message ListApiKeysRequest {}

message ListApiKeysResponse {
	repeated ApiKey keys = 1;
}

message CreateApiKeyRequest {
	string name = 1;
	bool read_only = 2;
}

message CreateApiKeyResponse {
	ApiKey key = 1;
	string secret = 2;
}

message DeleteApiKeyRequest {
	int32 id = 1;
}

message DeleteApiKeyResponse {}

service WackyTrackyClientService {
	rpc Version(VersionRequest) returns (VersionResponse) {}

	rpc Init(InitRequest) returns (InitResponse) {}

	rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {}
	rpc LoginWithUsernameAndPassword(LoginWithUsernameAndPasswordRequest) returns (LoginWithUsernameAndPasswordResponse) {}
	rpc Logout(LogoutRequest) returns (LogoutResponse) {}
	rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {}

	rpc GetUsers(GetUsersRequest) returns (GetUsersResponse) {}
	rpc GetUser(GetUserRequest) returns (GetUserResponse) {}
	rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}
	rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {}
	rpc ResetUserPassword(ResetUserPasswordRequest) returns (ResetUserPasswordResponse) {}

	rpc ListRbacPermissions(ListRbacPermissionsRequest) returns (ListRbacPermissionsResponse) {}
	rpc ListRbacRoles(ListRbacRolesRequest) returns (ListRbacRolesResponse) {}
	rpc CreateRbacRole(CreateRbacRoleRequest) returns (CreateRbacRoleResponse) {}
	rpc UpdateRbacRole(UpdateRbacRoleRequest) returns (RbacRole) {}
	rpc DeleteRbacRole(DeleteRbacRoleRequest) returns (DeleteRbacRoleResponse) {}
	rpc GetUserRbacRoles(GetUserRbacRolesRequest) returns (GetUserRbacRolesResponse) {}
	rpc GetUserGroupRbacRoles(GetUserGroupRbacRolesRequest) returns (GetUserGroupRbacRolesResponse) {}
	rpc SetUserGroupRbacRoles(SetUserGroupRbacRolesRequest) returns (SetUserGroupRbacRolesResponse) {}
	rpc GetRbacRoleUsers(GetRbacRoleUsersRequest) returns (GetRbacRoleUsersResponse) {}
	rpc GetRbacRoleGroups(GetRbacRoleGroupsRequest) returns (GetRbacRoleGroupsResponse) {}
	rpc GetMyPermissionsAudit(GetMyPermissionsAuditRequest) returns (GetMyPermissionsAuditResponse) {}

	rpc ListUserGroups(ListUserGroupsRequest) returns (ListUserGroupsResponse) {}
	rpc CreateUserGroup(CreateUserGroupRequest) returns (CreateUserGroupResponse) {}
	rpc DeleteUserGroup(DeleteUserGroupRequest) returns (DeleteUserGroupResponse) {}
	rpc GetUserGroupMembers(GetUserGroupMembersRequest) returns (GetUserGroupMembersResponse) {}
	rpc SetUserGroupMembers(SetUserGroupMembersRequest) returns (SetUserGroupMembersResponse) {}

	rpc ImpersonateUser(ImpersonateUserRequest) returns (ImpersonateUserResponse) {}
	rpc StopImpersonation(StopImpersonationRequest) returns (StopImpersonationResponse) {}

	rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse) {}
	rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse) {}
	rpc DeleteApiKey(DeleteApiKeyRequest) returns (DeleteApiKeyResponse) {}

	rpc GetLists(GetListsRequest) returns (GetListsResponse) {}

	rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {}

	rpc SearchTasks(SearchTasksRequest) returns (SearchTasksResponse) {}

	rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse) {}

	rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse) {}

	rpc DoneTask(DoneTaskRequest) returns (DoneTaskResponse) {}

	rpc MoveTask(MoveTaskRequest) returns (MoveTaskResponse) {}

	rpc CreateList(CreateListRequest) returns (CreateListResponse) {}

	rpc Tag(TagRequest) returns (TagResponse) {}

	rpc UpdateList(UpdateListRequest) returns (UpdateListResponse) {}

	rpc DeleteList(DeleteListRequest) returns (DeleteListResponse) {}

	rpc GetTags(GetTagsRequest) returns (GetTagsResponse) {}

	rpc RepoStatus(RepoStatusRequest) returns (RepoStatusResponse) {}
	rpc RepoSync(RepoSyncRequest) returns (RepoSyncResponse) {}

	rpc GetSavedSearches(GetSavedSearchesRequest) returns (GetSavedSearchesResponse) {}
	rpc SetSavedSearches(SetSavedSearchesRequest) returns (SetSavedSearchesResponse) {}

	rpc GetTaskMetadata(GetTaskMetadataRequest) returns (GetTaskMetadataResponse) {}
	rpc SetTaskMetadata(SetTaskMetadataRequest) returns (SetTaskMetadataResponse) {}

	rpc GetTaskPropertyProperties(GetTaskPropertyPropertiesRequest) returns (GetTaskPropertyPropertiesResponse) {}
	rpc SetTaskPropertyProperty(SetTaskPropertyPropertyRequest) returns (SetTaskPropertyPropertyResponse) {}

	rpc RuleStatus(RuleStatusRequest) returns (RuleStatusResponse) {}
	rpc RuleTest(RuleTestRequest) returns (RuleTestResponse) {}
}
